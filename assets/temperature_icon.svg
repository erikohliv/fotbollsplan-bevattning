<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Temperature thermometer icon -->
  <g id="thermometer">
    <!-- Bulb -->
    <circle cx="32" cy="48" r="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    
    <!-- Tube -->
    <rect x="26" y="12" width="12" height="38" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="2" rx="6"/>
    
    <!-- Mercury column -->
    <rect x="28" y="20" width="8" height="30" fill="#f44336" rx="4"/>
    
    <!-- Scale marks -->
    <line x1="38" y1="16" x2="42" y2="16" stroke="#666" stroke-width="1.5"/>
    <line x1="38" y1="22" x2="40" y2="22" stroke="#666" stroke-width="1"/>
    <line x1="38" y1="28" x2="42" y2="28" stroke="#666" stroke-width="1.5"/>
    <line x1="38" y1="34" x2="40" y2="34" stroke="#666" stroke-width="1"/>
    <line x1="38" y1="40" x2="42" y2="40" stroke="#666" stroke-width="1.5"/>
    
    <!-- Center highlight -->
    <ellipse cx="32" cy="48" rx="6" ry="5" fill="#ff6659" opacity="0.6"/>
  </g>
</svg>
