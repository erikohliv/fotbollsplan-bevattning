<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- IK Kamp logga - exakt som originalet -->
  <defs>
    <style>
      .kamp-gold { fill: #FFD700; }
      .kamp-wine { fill: #8B1538; }
      .kamp-blue { fill: #003A70; }
    </style>
  </defs>
  
  <!-- Yttre gul cirkel -->
  <circle cx="100" cy="100" r="90" class="kamp-gold"/>
  
  <!-- Inre blå cirkel -->
  <circle cx="100" cy="100" r="75" class="kamp-blue"/>
  
  <!-- Vinröd diamant/romb i mitten (roterad fyrkant) -->
  <rect x="55" y="55" width="90" height="90" class="kamp-wine" transform="rotate(45 100 100)"/>
  
  <!-- Stor gul K-bokstav -->
  <g>
    <!-- Vertikal stolpe i K -->
    <rect x="70" y="60" width="14" height="80" class="kamp-gold"/>
    
    <!-- Övre diagonalen i K -->
    <rect x="84" y="68" width="14" height="45" class="kamp-gold" transform="rotate(-40 91 90)"/>
    
    <!-- Nedre diagonalen i K -->
    <rect x="84" y="102" width="14" height="45" class="kamp-gold" transform="rotate(40 91 124)"/>
  </g>
  
  <!-- KAMP text i gul ruta -->
  <g transform="translate(105, 88)">
    <rect x="0" y="0" width="65" height="24" rx="3" class="kamp-gold"/>
    <text x="32.5" y="17" font-family="Arial Black, sans-serif" font-size="16" font-weight="bold" 
          text-anchor="middle" class="kamp-blue">KAMP</text>
  </g>
</svg>

